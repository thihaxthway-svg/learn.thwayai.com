<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030810;--panel:rgba(8,20,38,.88);--ice:#6CC8DE;--gold:#FFD700;--txt:#d8e4f0;--dim:#5a7a9a;--bdr:rgba(255,255,255,.06);--sans:'Outfit',sans-serif;--ser:'DM Serif Display',serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
.wrap{display:flex;height:100vh}
.left{width:25%;min-width:260px;max-width:340px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--bdr);backdrop-filter:blur(16px);z-index:2;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.left::-webkit-scrollbar{width:4px}.left::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.right{flex:1;position:relative}canvas#c3d{display:block;width:100%;height:100%}
.hdr{padding:.7rem .9rem;border-bottom:1px solid var(--bdr)}.hdr h1{font-family:var(--ser);font-size:.95rem;color:#fff}.hdr h1 span{color:var(--ice)}.hdr-sub{font-size:.52rem;color:var(--dim);margin-top:.1rem}
.k-hero{padding:.8rem .9rem;text-align:center;border-bottom:1px solid var(--bdr)}
.k-num{font-size:3.2rem;font-weight:800;letter-spacing:-.03em;line-height:1;background:linear-gradient(135deg,var(--ice),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.k-lbl{font-size:.6rem;color:var(--dim);margin-top:.15rem}.k-type{font-family:var(--ser);font-size:1rem;color:var(--gold);margin-top:.25rem}.k-watts{font-size:.62rem;color:var(--dim);margin-top:.1rem}
.scale{padding:.6rem .9rem;border-bottom:1px solid var(--bdr)}
.scale-track{position:relative;height:22px;background:rgba(255,255,255,.03);border-radius:4px}.scale-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:linear-gradient(90deg,#1a3a5c,var(--ice),var(--gold));opacity:.35;transition:width .3s}
.scale-marker{position:absolute;top:-2px;width:2px;height:26px;background:var(--gold);border-radius:2px;transition:left .3s;box-shadow:0 0 10px rgba(255,215,0,.5)}.scale-marker::after{content:'';position:absolute;top:-3px;left:-4px;width:10px;height:10px;background:var(--gold);border-radius:50%;box-shadow:0 0 8px rgba(255,215,0,.5)}
.scale-zones{display:flex;height:100%}.scale-zone{display:flex;align-items:center;justify-content:center;font-size:.45rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.06)}.scale-zone:last-child{border:none}

.tg{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;border-radius:6px;border:1px solid var(--bdr);background:rgba(255,255,255,.01);cursor:pointer;transition:.15s;user-select:none;margin-bottom:.25rem}.tg:hover{background:rgba(255,255,255,.03)}.tg.on{border-color:rgba(108,200,222,.3);background:rgba(108,200,222,.05)}

  // ═══════════════════════════════════════════════════════

  const grsU=.37,grsV=.66;

/*── Saturn: soft golden bands, hexagonal north pole, subtle storms ──*/
function mkSaturn(){
const W=2048,H=1024,cv=document.createElement('canvas');cv.width=W;cv.height=H;
const cx=cv.getContext('2d'),im=cx.createImageData(W,H),px=im.data;const{fb}=mkN(606);
const bands=[[195,182,142],[215,202,162],[205,192,150],[225,212,172],[198,185,145],[232,220,178],[210,198,158],[228,216,176],[200,188,148],[222,210,170],[208,195,155],[230,218,178],[202,190,150],[218,205,165],[195,182,142],[210,198,158],[200,188,148]];
for(let y=0;y<H;y++){for(let x=0;x<W;x++){const i=(y*W+x)*4,u=x/W,v=y/H;
  const turb=fb(u*5,v*4,4)*.012;
  const bv=(v+turb)*bands.length;const bi=Math.floor(bv),bf=bv-bi;
  const b0=bands[Math.max(0,Math.min(bands.length-1,bi))],b1=bands[Math.max(0,Math.min(bands.length-1,bi+1))];
  const sm=bf*bf*(3-2*bf);
  let r=b0[0]+(b1[0]-b0[0])*sm,g=b0[1]+(b1[1]-b0[1])*sm,b=b0[2]+(b1[2]-b0[2])*sm;
  const flow=fb(u*18,v*35,4)*7;r+=flow;g+=flow*.82;b+=flow*.62;
  const st=fb(u*35,v*50,3)*4;r+=st;g+=st*.78;b+=st*.58;

    const hex=Math.cos(ang*3)*.3*(1-pLat);
    const hCol=fb(u*8+.5,v*60,3)*8;
    r+=hex*15+hCol;g+=hex*10+hCol*.7;b+=hex*5+hCol*.4;
    // Polar darkening
    if(pLat<.4){const d=1-pLat/.4;r-=d*18;g-=d*14;b-=d*8;}}
  // Great White Spot (periodic storm ~v=0.35)
  const gws=ellD(u,v,.6,.35,.02,.008);if(gws<1){const s=(1-Math.sqrt(gws))*.25;r+=s*30;g+=s*28;b+=s*20;}
  // String of pearls (SEB storm train)
  for(let p=0;p<6;p++){const pd=ellD(u,v,.1+p*.15,.58,.008,.005);if(pd<1){const s=(1-Math.sqrt(pd))*.2;r+=s*20;g+=s*18;b+=s*12;}}

  px[i]=clm(r);px[i+1]=clm(g);px[i+2]=clm(b);px[i+3]=255;

/*── Neptune: deep blue, Great Dark Spot, Scooter, white cirrus clouds, wind bands ──*/
function mkNeptune(){
const W=2048,H=1024,cv=document.createElement('canvas');cv.width=W;cv.height=H;
const cx=cv.getContext('2d'),im=cx.createImageData(W,H),px=im.data;const{fb}=mkN(808);
for(let y=0;y<H;y++){for(let x=0;x<W;x++){const i=(y*W+x)*4,u=x/W,v=y/H;
  // Base deep blue with subtle banding
  const band=fb(u*2,v*16+fb(u*3.5,v*4.5,3)*.45,5);
  let r=38+band*28,g=68+band*42,b=178+band*38;
  // Wind-speed-driven zonal banding
  const fl=fb(u*14+1,v*28,4)*9;r+=fl*.45;g+=fl*.65;b+=fl;
  const fl2=fb(u*25,v*40,3)*5;r+=fl2*.3;g+=fl2*.5;b+=fl2*.8;
  // Great Dark Spot (~20°S, Voyager 2 observation)
  const gdsU=.4,gdsV=.58,gdsRW=.055,gdsRH=.03;
  const gdsA=.08,gdcs=Math.cos(gdsA),gdsn=Math.sin(gdsA);
  const gdx2=u-gdsU,gdy2=v-gdsV,gdrx=gdx2*gdcs-gdy2*gdsn,gdry=gdx2*gdsn+gdy2*gdcs;
  const gdsD=(gdrx*gdrx)/(gdsRW*gdsRW)+(gdry*gdry)/(gdsRH*gdsRH);
  if(gdsD<1.3){const gds2=Math.sqrt(gdsD);const s=Math.max(0,1-gds2);
    // Dark interior with swirling structure
    const ang=Math.atan2(gdry,gdrx);
    const swl=fb(ang*2+s*4,s*6,3)*.12;
    r-=s*22+swl*8;g-=s*28+swl*10;b-=s*32+swl*12;
    // Bright companion cloud (methane cirrus above the spot)
    if(gds2>.4&&gds2<.9){const cAng=Math.atan2(gdy2,gdx2);
      if(cAng>-.8&&cAng<.4){const cc=(1-Math.abs(gds2-.65)/.25)*.3;
        r+=cc*55;g+=cc*55;b+=cc*40;}}}
  // Scooter cloud (bright fast-moving feature ~40°S)
  const scD=ellD(u,v,.6,.67,.015,.008);if(scD<1){const s=(1-Math.sqrt(scD))*.5;r+=s*58;g+=s*55;b+=s*42;}

  // Bright white methane cloud streaks (high-altitude cirrus)

  // South polar bright region
  if(v>.84){const s=(v-.84)/.16;r+=s*18;g+=s*22;b+=s*14;}
  // Subtle polar darkening at north
  if(v<.12){const d=(1-v/.12)*.15;r-=d*12;g-=d*15;b-=d*10;}
  px[i]=clm(r);px[i+1]=clm(g);px[i+2]=clm(b);px[i+3]=255;
}}cx.putImageData(im,0,0);const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;tx.wrapS=THREE.RepeatWrapping;return tx;}

function ll3(lon,lat,r){var p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));}

function makeIcon(draw,color,sz){
  sz=sz||64;var c=document.createElement('canvas');c.width=sz;c.height=sz;var x=c.getContext('2d');
  x.clearRect(0,0,sz,sz);
  x.save();x.translate(sz/2,sz/2);draw(x,sz*.35,color);x.restore();
  var tex=new THREE.CanvasTexture(c);return tex;
}

function arcPoints(p1,p2,n){
  var pts=[];for(var i=0;i<=n;i++){var t=i/n;var v=new THREE.Vector3().lerpVectors(p1,p2,t).normalize().multiplyScalar(1.22);;pts.push(v);}return pts;
}

// Icon draw functions
function drawWheat(ctx,r,col){
  // Wheat sheaf
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,r*.7);ctx.lineTo(0,-r*.3);ctx.stroke();
  for(var i=0;i<3;i++){var y=-r*.2+i*r*.3;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(-r*.5,y-r*.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(r*.5,y-r*.3);ctx.stroke();}
  // Grain dots
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(-r*.5,-r*.5,r*.12,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(r*.5,-r*.5,r*.12,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(0,-r*.5,r*.12,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(-r*.3,-r*.2,r*.1,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(r*.3,-r*.2,r*.1,0,6.28);ctx.fill();
}
function drawTrain(ctx,r,col){
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2;
  // Boiler body
  ctx.beginPath();
  ctx.moveTo(-r*.7,r*.1);ctx.lineTo(-r*.7,-r*.2);ctx.lineTo(r*.4,-r*.2);
  ctx.lineTo(r*.5,-r*.35);ctx.lineTo(r*.7,-r*.35);ctx.lineTo(r*.7,r*.1);
  ctx.closePath();ctx.fill();
  // Cabin
  ctx.fillRect(-r*.7,-r*.55,r*.45,r*.35);
  // Smokestack
  ctx.fillRect(r*.2,-r*.6,r*.18,r*.25);
  ctx.fillRect(r*.14,-r*.65,r*.3,r*.08);
  // Steam puff
  ctx.globalAlpha=.6;
  ctx.beginPath();ctx.arc(r*.28,-r*.8,r*.12,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(r*.1,-r*.85,r*.1,0,6.28);ctx.fill();
  ctx.globalAlpha=1;
  // Wheels
  ctx.beginPath();ctx.arc(-r*.4,r*.2,r*.15,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(r*.15,r*.2,r*.15,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(r*.5,r*.2,r*.12,0,6.28);ctx.fill();
  // Track
  ctx.fillRect(-r*.8,r*.35,r*1.7,r*.06);
}
function drawWifi(ctx,r,col){
  // Clear wifi signal
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';
  for(var i=1;i<=3;i++){ctx.beginPath();ctx.arc(0,r*.2,r*.2*i,-1.05*Math.PI,-.05*Math.PI);ctx.stroke();}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,r*.2,r*.08,0,6.28);ctx.fill();
}

function drawWaterWheel(ctx,r,col){
  ctx.strokeStyle=col;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,r*.5,0,6.28);ctx.stroke();
  for(var i=0;i<6;i++){var a=i/6*6.28;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5);ctx.stroke();
    ctx.fillStyle=col;ctx.fillRect(Math.cos(a)*r*.45-r*.08,Math.sin(a)*r*.45-r*.06,r*.16,r*.12);}
  ctx.beginPath();ctx.arc(0,0,r*.1,0,6.28);ctx.fillStyle=col;ctx.fill();
}

function drawLightning(ctx,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(r*.1,-r*.8);ctx.lineTo(-r*.3,-r*.05);ctx.lineTo(r*.05,-r*.05);
  ctx.lineTo(-r*.15,r*.8);ctx.lineTo(r*.4,r*.05);ctx.lineTo(r*.05,r*.05);
  ctx.closePath();ctx.fill();
}

function drawOilDerrick(ctx,r,col){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,-r*.8);ctx.lineTo(-r*.4,r*.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-r*.8);ctx.lineTo(r*.4,r*.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.3,r*.1);ctx.lineTo(r*.3,r*.1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.2,-r*.25);ctx.lineTo(r*.2,-r*.25);ctx.stroke();
  ctx.fillRect(-r*.5,r*.55,r*1,r*.1);
  ctx.fillRect(-r*.06,-r*.8,r*.12,r*.3);
}

function drawGlobe(ctx,r,col){
  ctx.strokeStyle=col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,0,r*.5,0,6.28);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,r*.2,r*.5,0,0,6.28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.5,0);ctx.lineTo(r*.5,0);ctx.stroke();
}

function drawBrain(ctx,r,col){
  ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  // Brain outline - exact match of cluster diagram SVG
  // M-8,-12 C-8,-18 8,-18 8,-12 C14,-12 14,4 8,4 L8,8 C8,14 -8,14 -8,8 L-8,4 C-14,4 -14,-12 -8,-12Z
  var s=r/16;
  ctx.beginPath();
  ctx.moveTo(-8*s,-12*s);
  ctx.bezierCurveTo(-8*s,-18*s, 8*s,-18*s, 8*s,-12*s);
  ctx.bezierCurveTo(14*s,-12*s, 14*s,4*s, 8*s,4*s);
  ctx.lineTo(8*s,8*s);
  ctx.bezierCurveTo(8*s,14*s, -8*s,14*s, -8*s,8*s);
  ctx.lineTo(-8*s,4*s);
  ctx.bezierCurveTo(-14*s,4*s, -14*s,-12*s, -8*s,-12*s);
  ctx.closePath();ctx.stroke();
  // Inner lines - M-4,0 L4,0 M0,-6 L0,6
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-4*s,0);ctx.lineTo(4*s,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-6*s);ctx.lineTo(0,6*s);ctx.stroke();
  // Brain fold curves
  // M-6,-8 C-6,-4 -2,-2 0,-6
  ctx.beginPath();ctx.moveTo(-6*s,-8*s);ctx.bezierCurveTo(-6*s,-4*s,-2*s,-2*s,0,-6*s);ctx.stroke();
  // M6,-8 C6,-4 2,-2 0,-6
  ctx.beginPath();ctx.moveTo(6*s,-8*s);ctx.bezierCurveTo(6*s,-4*s,2*s,-2*s,0,-6*s);ctx.stroke();
}
function drawBitcoin(ctx,r,col){
  ctx.fillStyle=col;ctx.font='bold '+(r*1.6)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('\u20BF',0,0);
}

function drawRocket(ctx,r,col){
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2;
  // Body + nose cone
  ctx.beginPath();
  ctx.moveTo(0,-r*.9);ctx.lineTo(-r*.3,-r*.3);ctx.lineTo(-r*.3,r*.45);
  ctx.lineTo(r*.3,r*.45);ctx.lineTo(r*.3,-r*.3);ctx.closePath();ctx.fill();
  // Left fin
  ctx.beginPath();ctx.moveTo(-r*.3,r*.15);ctx.lineTo(-r*.7,r*.65);ctx.lineTo(-r*.3,r*.45);ctx.closePath();ctx.fill();
  // Right fin
  ctx.beginPath();ctx.moveTo(r*.3,r*.15);ctx.lineTo(r*.7,r*.65);ctx.lineTo(r*.3,r*.45);ctx.closePath();ctx.fill();
  // Exhaust flame
  ctx.globalAlpha=.6;ctx.fillStyle='#ff6633';
  ctx.beginPath();ctx.moveTo(-r*.15,r*.45);ctx.quadraticCurveTo(0,r*.9,r*.15,r*.45);ctx.fill();
  ctx.globalAlpha=1;
}

function drawAtom(ctx,r,col){
  // Radiation trefoil matching cluster diagram
  ctx.fillStyle=col;ctx.strokeStyle=col;
  var blades=[[-.115*Math.PI],[.552*Math.PI],[1.218*Math.PI]];
  for(var i=0;i<3;i++){
    var angle=(i*120-90)*Math.PI/180;
    var a1=angle-25*Math.PI/180,a2=angle+25*Math.PI/180;
    var ri=r*.2,ro=r*.7;
    ctx.beginPath();
    ctx.moveTo(ri*Math.cos(a1),ri*Math.sin(a1));
    ctx.lineTo(ro*Math.cos(a1),ro*Math.sin(a1));
    ctx.arc(0,0,ro,a1,a2);
    ctx.lineTo(ri*Math.cos(a2),ri*Math.sin(a2));
    ctx.arc(0,0,ri,a2,a1,true);
    ctx.closePath();ctx.fill();
  }
  // Center dot
  ctx.beginPath();ctx.arc(0,0,r*.1,0,6.28);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
}

function drawQuantum(ctx,r,col){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.strokeRect(-r*.6,-r*.7,r*1.2,r*1.4);
  ctx.lineWidth=2.5;
  [-.35,0,.35].forEach(function(p){
    ctx.beginPath();ctx.moveTo(p*r,-r*.7);ctx.lineTo(p*r,-r*.9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(p*r,r*.7);ctx.lineTo(p*r,r*.9);ctx.stroke();});
  [-.3,0,.3].forEach(function(p){
    ctx.beginPath();ctx.moveTo(-r*.6,p*r);ctx.lineTo(-r*.8,p*r);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*.6,p*r);ctx.lineTo(r*.8,p*r);ctx.stroke();});
  ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,r*.4,r*.15,0,0,6.28);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,r*.4,r*.15,1.05,0,6.28);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,r*.4,r*.15,-1.05,0,6.28);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.08,0,6.28);ctx.fill();
}

function drawRobot(ctx,r,col){
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2.5;
  // Body
  ctx.strokeRect(-r*.55,-r*.3,r*1.1,r*.85);
  // Head
  ctx.strokeRect(-r*.4,-r*.7,r*.8,r*.45);
  // Antenna
  ctx.beginPath();ctx.moveTo(0,-r*.7);ctx.lineTo(0,-r*.9);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-r*.9,r*.06,0,6.28);ctx.fill();
  // Eyes
  ctx.beginPath();ctx.moveTo(-r*.25,-r*.5);ctx.lineTo(-r*.1,-r*.5);ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*.1,-r*.5);ctx.lineTo(r*.25,-r*.5);ctx.stroke();
  // Arms
  ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-r*.55,0);ctx.lineTo(-r*.8,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*.55,0);ctx.lineTo(r*.8,0);ctx.stroke();
  // Legs
  ctx.beginPath();ctx.moveTo(-r*.3,r*.55);ctx.lineTo(-r*.3,r*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*.3,r*.55);ctx.lineTo(r*.3,r*.8);ctx.stroke();
}

      overlayGroups[key].visible=activeT.has(key);
      if(overlayGroups[key].visible){
        overlayGroups[key].traverse(function(c){if(c.material){c.material.opacity=c.material.isLineBasicMaterial?.7:1;}});
      }
    }
  });
}

// ═══ TRANSITIONS ═══
function updateScene(){
  // Completely hide groups not in use
  // Clean fades: Earth 0-1.05, Solar 1.0-2.0, Galaxy 2.0-3
  var earthOp = currentK<1?1:(currentK<1.05?1-(currentK-1)/.05:0);
  var solOp = currentK<1?0:(currentK<1.05?(currentK-1)/.05:(currentK<1.95?1:(currentK<2?1-(currentK-1.95)/.05:0)));
  var galOp = currentK<1.95?0:(currentK<2?(currentK-1.95)/.05:1);
  earthGroup.visible=earthOp>0;
  solGroup.visible=solOp>0;
  galGroup.visible=galOp>0;
  eMat.opacity=earthOp;
  // Fade solar system children
  solGroup.traverse(function(c){if(c.material&&c.material.transparent!==undefined){c.material.opacity=c.material._baseOp!==undefined?c.material._baseOp*solOp:solOp;}});
  // Fade galaxy
  galGroup.traverse(function(c){if(c.material){c.material.opacity=galOp;}});
}

// Store base opacities
solGroup.traverse(function(c){if(c.material&&c.material.opacity!==undefined)c.material._baseOp=c.material.opacity;c.material&&(c.material.transparent=true);});
var galAngle=0;

// Tooltip raycasting
var raycaster=new THREE.Raycaster();
raycaster.params.Points={threshold:.1};
var mouseV=new THREE.Vector2(-9,-9);
var tipEl=document.getElementById('tip'),tipL=document.getElementById('tipL'),tipN=document.getElementById('tipN');
cv.addEventListener('mousemove',function(e){
  var rect=cv.getBoundingClientRect();
  mouseV.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouseV.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseV,cam);
  var allSprites=[];
  Object.keys(overlayGroups).forEach(function(k){
    if(overlayGroups[k].visible){
      overlayGroups[k].traverse(function(c){if(c.isSprite&&c.userData.t)allSprites.push(c);});
    }
  });
  var hits=raycaster.intersectObjects(allSprites);
  if(hits.length>0){
    var h=hits[0].object;
    tipL.textContent=h.userData.t;tipL.style.color=h.userData.c;
    tipN.textContent=h.userData.n;
    // Project 3D position to screen
    var wp=new THREE.Vector3();h.getWorldPosition(wp);
    var sp=wp.clone().project(cam);
    var rect2=cv.getBoundingClientRect();
    var sx=rect2.left+(sp.x+1)/2*rect2.width+15;
    var sy=rect2.top+(-sp.y+1)/2*rect2.height-15;
    tipEl.style.left=sx+'px';tipEl.style.top=sy+'px';
    tipEl.style.display='block';cv.style.cursor='pointer';
  } else {tipEl.style.display='none';cv.style.cursor='default';}
});
cv.addEventListener('mouseleave',function(){tipEl.style.display='none';});

var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);var t=clock.getElapsedTime();
  eMesh.rotation.y=t*.1;
  planets.forEach(function(p){p.angle+=.002*p.speed;p.mesh.position.set(Math.cos(p.angle)*p.dist,0,Math.sin(p.angle)*p.dist);p.mesh.rotation.y=t*.3;});
  galAngle+=0.0002;
  if(galGroup.visible&&galGroup.children.length>0){
    galGroup.children.forEach(function(c){
      c.lookAt(cam.position);
      c.rotateZ(galAngle);
    });
  }
  controls.update();
  renderer.render(scene,cam);
}
function onResize(){var w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',onResize);onResize();animate();

function updateUI(){var w=kToW(currentK);document.getElementById('kN').textContent=currentK.toFixed(2);document.getElementById('kW').textContent=fmtW(w);document.getElementById('kT').textContent=typeName(currentK);var pct=(currentK/3)*100;document.getElementById('sF').style.width=pct+'%';document.getElementById('sM').style.left=pct+'%';document.getElementById('kT').style.color=currentK>=2?'#C084FC':currentK>=1?'var(--gold)':'var(--ice)';updateScene();}
function buildToggles(){var rE=document.getElementById('tR'),cE=document.getElementById('tC');rE.innerHTML='';cE.innerHTML='';REVS.forEach(function(r,i){var d=document.createElement('div');d.className='tg';d.innerHTML='<div class="tg-sw"></div><div class="tg-name">'+r.name+'</div><div class="tg-delta">+'+r.delta.toFixed(2)+'</div>';d.onclick=function(){toggleRev(i)};rE.appendChild(d);});CLUSTERS.forEach(function(c2){var d=document.createElement('div');d.className='tg';d.innerHTML='<div class="tg-sw"></div><div class="tg-name">'+c2.name+'</div><div class="tg-delta">+'+c2.delta.toFixed(2)+'</div>';d.onclick=function(){if(activeT.has(c2.id))activeT.delete(c2.id);else activeT.add(c2.id);d.classList.toggle('on');manual=false;recalc();};cE.appendChild(d);});}
function toggleRev(idx){manual=false;var els=document.querySelectorAll('#tR .tg');if(activeT.has(REVS[idx].id)){activeT.delete(REVS[idx].id);els[idx].classList.remove('on');}else{activeT.add(REVS[idx].id);els[idx].classList.add('on');}recalc();}
function recalc(){if(!manual){var k=0;allItems.forEach(function(r){if(activeT.has(r.id))k+=r.delta;});currentK=Math.round(k*1000)/1000;document.getElementById('slider').value=currentK;}updateUI();updateOverlays();}
document.getElementById('slider').addEventListener('input',function(e){manual=true;currentK=parseFloat(e.target.value);activeT.clear();document.querySelectorAll('.tg').forEach(function(t){t.classList.remove('on')});updateUI();});
buildToggles();updateUI();
</script></body></html>
