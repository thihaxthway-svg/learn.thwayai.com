/* Timeline */
.timeline{position:relative;padding:1rem 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--ice),rgba(108,200,222,.3),var(--ice),transparent);transform:translateX(-50%)}

.era{text-align:center;position:relative;margin:2.5rem 0 1.5rem;z-index:2}
.era-badge{display:inline-block;background:var(--bg2);border:1px solid var(--ice);border-radius:100px;padding:.4rem 1.2rem;font-family:var(--serif);font-size:.9rem;color:var(--ice)}
.era-years{font-size:.65rem;color:var(--text3);margin-top:.3rem}
/* Cards */
.card{position:relative;width:45%;margin-bottom:2rem;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
.card.visible{opacity:1;transform:translateY(0)}
.card.left{margin-right:auto;margin-left:0;text-align:right;padding-right:2rem}
.card.right{margin-left:auto;margin-right:0;text-align:left;padding-left:2rem}
.card-inner{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:1rem 1.2rem;position:relative;transition:border-color .3s,box-shadow .3s}
.card-inner:hover{border-color:rgba(108,200,222,.25);box-shadow:0 4px 20px rgba(0,0,0,.3)}
/* Connector dot on timeline */
.card::after{content:'';position:absolute;top:1.5rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ice);z-index:3}
.card.left::after{right:-6px}
.card.right::after{left:-6px}
/* Avatar */
.avatar{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:.5rem;overflow:hidden;border:2px solid rgba(255,255,255,.15);position:relative}
.av-init{position:absolute;font-weight:800;font-size:1.1rem;z-index:0}
.avatar img{position:relative;z-index:1}
.card.left .avatar{margin-left:.5rem}
.card-year{font-size:.62rem;color:var(--text3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.2rem}
.card-name{font-family:var(--serif);font-size:1.05rem;color:#fff;margin-bottom:.15rem}
.card-role{font-size:.68rem;color:var(--ice);font-weight:600;margin-bottom:.4rem}
.card-desc{font-size:.75rem;color:var(--text2);line-height:1.5}
.card-quote{font-size:.7rem;color:var(--text3);font-style:italic;margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--bdr)}
.era-group{overflow:hidden;max-height:5000px;transition:max-height .5s ease}
.era-group:not(.open){max-height:0}
.era-badge{cursor:pointer;transition:transform .2s}.era-badge:hover{transform:scale(1.03)}
.era-arrow{font-size:.7rem;margin-left:.3rem;display:inline-block;transition:transform .2s}
/* Footer */
.footer{text-align:center;padding:2rem 0 1rem;font-size:.62rem;color:var(--text3);border-top:1px solid var(--bdr);margin-top:2rem}
.footer a{color:var(--ice);text-decoration:none}
@media(max-width:600px){.card{width:85%;margin-left:auto!important;margin-right:0!important;text-align:left!important;padding-left:2rem!important;padding-right:0!important}.card::after{left:-6px!important;right:auto!important}.timeline::before{left:0}}
</style>

const tl = document.getElementById('tl');
let side = 'left';

let currentGroup = null;
DATA.forEach((item, i) => {
  if (item.era) {
    const era = document.createElement('div');
    era.className = 'era';
    era.innerHTML = `<div class="era-badge">${item.era} <span class="era-arrow">▾</span></div><div class="era-years">${item.years}</div>`;
    tl.appendChild(era);
    currentGroup = document.createElement('div');
    currentGroup.className = 'era-group open';
    tl.appendChild(currentGroup);
    era.style.cursor = 'pointer';
    era.onclick = ((grp) => () => { grp.classList.toggle('open'); era.querySelector('.era-arrow').textContent = grp.classList.contains('open') ? '▾' : '▸'; })(currentGroup);
    side = 'left';
    return;
  }

  const card = document.createElement('div');
  card.className = `card ${side}`;

  const avatarHtml = item.img
    ? '<div class="avatar" style="border-color:'+item.color+'40"><img src="'+item.img+'" alt="'+item.name+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.style.display=\'none\'"><span class="av-init" style="color:'+item.color+'">'+item.initials+'</span></div>'
    : '<div class="avatar" style="background:'+item.color+'15;border-color:'+item.color+'40"><span class="av-init" style="color:'+item.color+'">'+item.initials+'</span></div>';
  const quoteHtml = item.quote ? `<div class="card-quote">"${item.quote}"</div>` : '';

  card.innerHTML = `
    <div class="card-inner">
      ${avatarHtml}
      <div class="card-year">${item.y}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-role">${item.role}</div>
      <div class="card-desc">${item.desc}</div>
      ${quoteHtml}
    </div>
  `;

  (currentGroup || tl).appendChild(card);
  side = side === 'left' ? 'right' : 'left';
});

// Scroll animation
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.15 });
document.querySelectorAll('.card').forEach(c => observer.observe(c));
</script>
